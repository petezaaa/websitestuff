# Gradle / build tuning
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

## Environment ---------------------------------------------------------------
# Minecraft + Forge (1.20.1 line). Bump forge_version to any 47.x build you have.
minecraft_version=1.20.1
forge_version=47.3.0
# Mojang official mappings (human-readable names). This is what the source uses.
mapping_channel=official
mapping_version=1.20.1

## Baritone ------------------------------------------------------------------
# Baritone Forge build for MC 1.20.1. Drop the matching
# `baritone-api-forge-<baritone_version>.jar` into ./libs (for compiling) and
# the standalone jar into your `mods/` folder (for running). See README.
baritone_version=1.10.2

## Mod metadata --------------------------------------------------------------
mod_id=baritonebot
mod_name=Baritone Bot
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.baritonebot
mod_authors=petezaaa
mod_description=A command-driven autonomous bot built on Baritone: pathfinding, mining, schematic building, combat, crafting and smelting.
