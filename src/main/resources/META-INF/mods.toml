modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://github.com/petezaaa/websitestuff/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# --- Dependencies ---------------------------------------------------------

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"

# Baritone must be installed alongside this mod. It is client-only, so it is
# only required on the CLIENT side.
[[dependencies.${mod_id}]]
    modId="baritone"
    mandatory=true
    versionRange="[1.2,)"
    ordering="AFTER"
    side="CLIENT"
